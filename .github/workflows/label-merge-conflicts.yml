name: Check PRs for merge conflicts

on:
  # Check for new conflicts due to merges.
  push:
    branches:
      - develop
      - stable
  # Check conflicts in new PRs and for resolved conflicts due to an open PR being updated.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  check-prs:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'WordPress'
    permissions:
      pull-requests: write # Needed to add and remove labels on the PR.

    name: Check PRs for merge conflicts

    steps:
      - name: Check PRs for merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "Status: has merge conflict"
          repoToken: ${{ secrets.GITHUB_TOKEN }}
